[platformio]
default_envs = uno

[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
  -D WILDEBEEST_FIRMWARE_VERSION=\"0.1.0\"
check_tool = cppcheck
check_flags =
  cppcheck: --enable=warning,style,performance --suppress=missingIncludeSystem

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
  -I test_stubs
