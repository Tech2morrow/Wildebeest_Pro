DWAPlannerROS:
  odom_topic: /odometry/filtered
  global_frame_id: odom

  max_vel_x: 0.45
  min_vel_x: -0.12
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.45
  min_vel_trans: 0.05
  max_vel_theta: 1.80
  min_vel_theta: 0.15
  acc_lim_x: 0.60
  acc_lim_y: 0.0
  acc_lim_theta: 2.50

  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 16
  vy_samples: 1
  vth_samples: 32
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.04
  forward_point_distance: 0.22
  stop_time_buffer: 0.30
  scaling_speed: 0.25
  max_scaling_factor: 0.20
  oscillation_reset_dist: 0.15
  publish_traj_pc: true
  publish_cost_grid_pc: true
