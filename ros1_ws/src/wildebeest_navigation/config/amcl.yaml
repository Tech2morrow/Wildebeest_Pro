min_particles: 500
max_particles: 3000
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.08
update_min_a: 0.10
resample_interval: 1
transform_tolerance: 0.30
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.10

laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0
laser_max_beams: 90
laser_z_hit: 0.92
laser_z_rand: 0.08
laser_sigma_hit: 0.16

odom_model_type: diff-corrected
odom_alpha1: 0.10
odom_alpha2: 0.10
odom_alpha3: 0.15
odom_alpha4: 0.15
odom_frame_id: odom
base_frame_id: base_link
global_frame_id: map
tf_broadcast: true
