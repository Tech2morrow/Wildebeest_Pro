joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 30

base_controller:
  type: diff_drive_controller/DiffDriveController
  # Noetic's diff_drive_controller accepts multiple joints per side. It sends
  # one side velocity to both axles and averages their feedback.
  left_wheel: [front_left_wheel_joint, rear_left_wheel_joint]
  right_wheel: [front_right_wheel_joint, rear_right_wheel_joint]
  wheel_separation: 0.121843
  wheel_radius: 0.033622
  publish_rate: 30
  cmd_vel_timeout: 0.25
  velocity_rolling_window_size: 8
  pose_covariance_diagonal: [0.03, 0.03, 99999.0, 99999.0, 99999.0, 0.08]
  twist_covariance_diagonal: [0.05, 0.05, 99999.0, 99999.0, 99999.0, 0.10]
  base_frame_id: base_link
  odom_frame_id: odom
  enable_odom_tf: false
  publish_cmd: true
  allow_multiple_cmd_vel_publishers: false

  linear:
    x:
      has_velocity_limits: true
      max_velocity: 0.45
      min_velocity: -0.45
      has_acceleration_limits: true
      max_acceleration: 0.60
      min_acceleration: -0.60
  angular:
    z:
      has_velocity_limits: true
      max_velocity: 1.80
      min_velocity: -1.80
      has_acceleration_limits: true
      max_acceleration: 2.50
      min_acceleration: -2.50
