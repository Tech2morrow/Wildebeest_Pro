site_name: Wildebeest Pro
site_description: Build, calibrate, operate, and extend the Wildebeest Pro four-wheel skid-steer autonomous robot.
site_url: https://tech2morrow.github.io/Wildebeest_Pro/
repo_url: https://github.com/Tech2morrow/Wildebeest_Pro
repo_name: Tech2morrow/Wildebeest_Pro
docs_dir: .
site_dir: ../site
strict: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Build the robot:
      - Readiness and compatibility: getting-started.md
      - Bill of materials: hardware/bom.md
      - Hardware limitations and upgrades: hardware/limitations.md
      - Wiring and pinout: hardware/wiring.md
      - Mechanical assembly: hardware/assembly.md
      - Calibration: calibration.md
  - Understand the system:
      - Architecture: architecture.md
      - ROS interface contract: software/interfaces.md
      - Serial protocol: reference/serial-protocol.md
  - Run the software:
      - ROS 2: software/ros2.md
      - ROS 1: software/ros1.md
      - Simulation: software/simulation.md
      - Operations runbook: operations.md
  - Verify and maintain:
      - Safety case: safety.md
      - Test and acceptance plan: testing.md
      - Troubleshooting: troubleshooting.md
      - Configuration record: reference/configuration-record.md
      - Contributing: contributing.md
      - Documentation sources: reference/sources.md

plugins:
  - search

exclude_docs: |
  _site/

copyright: Copyright &copy; Wildebeest Pro contributors — released under the repository license.
